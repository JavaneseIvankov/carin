name: carin-dev

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carin_dev}
      POSTGRES_USER: ${POSTGRES_USER:-carin_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private
    restart: unless-stopped

  minio:
    # Silo preserves MinIO S3/API/env compatibility; pin the exact release manifest.
    image: docker.io/pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private
    restart: unless-stopped

  minio-init:
    build:
      context: ../carin-api
      dockerfile: Dockerfile
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-carin-dev}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infra/.env}
    depends_on:
      minio:
        condition: service_healthy
    command: ["node", "dist/scripts/ensure-minio-bucket.js"]
    networks:
      - private
    restart: "no"

  migrate:
    build:
      context: ../carin-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carin_dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-carin_dev}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/db/migrate.js"]
    networks:
      - private
    restart: "no"

  api:
    build:
      context: ../carin-api
      dockerfile: Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-carin_dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-carin_dev}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in infra/.env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in infra/.env}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Set AUTH_TRUSTED_ORIGINS in infra/.env}
      APP_LINK_SCHEME: ${APP_LINK_SCHEME:?Set APP_LINK_SCHEME in infra/.env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-carin-dev}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in infra/.env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in infra/.env}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?Set MEDIA_SIGNING_SECRET in infra/.env}
      MEDIA_SIGNED_URL_BASE: ${MEDIA_SIGNED_URL_BASE:?Set MEDIA_SIGNED_URL_BASE in infra/.env}
      PORT: "3000"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private
    restart: unless-stopped

  email-worker:
    build:
      context: ../carin-api
      dockerfile: Dockerfile
    profiles: ["email"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-carin_dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-carin_dev}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in infra/.env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in infra/.env}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?Set AUTH_TRUSTED_ORIGINS in infra/.env}
      APP_LINK_SCHEME: ${APP_LINK_SCHEME:?Set APP_LINK_SCHEME in infra/.env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/email-worker.js"]
    networks:
      - private
    restart: unless-stopped

  # Durable C16 worker; C18 injects private photo URL generation for scan jobs.
  worker:
    build:
      context: ../carin-api
      dockerfile: Dockerfile
    profiles: ["worker"]
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-carin_dev}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}@postgres:5432/${POSTGRES_DB:-carin_dev}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-carin-dev}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in infra/.env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in infra/.env}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?Set MEDIA_SIGNING_SECRET in infra/.env}
      MEDIA_SIGNED_URL_BASE: ${MEDIA_SIGNED_URL_BASE:?Set MEDIA_SIGNED_URL_BASE in infra/.env}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-local-placeholder-change-before-use}
      AI_SERVICE_ALLOWED_HOSTS: ${AI_SERVICE_ALLOWED_HOSTS:-ai-service}
      AI_MODE: ${AI_MODE:-fixture}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    command: ["node", "dist/worker.js"]
    networks:
      - private
    restart: unless-stopped

  ai-service:
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    profiles: ["worker"]
    environment:
      APP_ENV: dev
      AI_CATALOG_MODE: ${AI_CATALOG_MODE:-unconfigured}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-local-placeholder-change-before-use}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_MODEL: ${VLM_MODEL:-qwen3.7-flash-2026-07-15}
      VLM_FALLBACK_MODEL: ${VLM_FALLBACK_MODEL:-qwen3.7-flash}
      VLM_TIMEOUT_SECONDS: ${VLM_TIMEOUT_SECONDS:-35}
      MEDIA_ALLOWED_HOSTS: minio:9000
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10485760}
      REQUEST_MAX_BYTES: ${AI_REQUEST_MAX_BYTES:-65536}
      API_RATE_LIMIT_PER_MINUTE: ${AI_SERVICE_RATE_LIMIT_PER_MINUTE:-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - private
    restart: unless-stopped

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
