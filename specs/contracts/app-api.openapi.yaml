  "/media/photos/{photoId}":
    get:
      operationId: "readSignedPhoto"
      summary: "Stream private photo using short-lived backend-issued bearer grant"
      security: []
      description: "Public API origin, not a public MinIO endpoint. Token binds photo/user/environment/expiry. Recheck resource/account deletion before streaming. Invalid/expired/deleted grants return the same 404. No token query logging or persistent image caching."
      parameters:
        -
          name: "photoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "token"
          in: "query"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 4096
      responses:
        "200":
          description: "Normalized photo bytes"
          headers:
            Cache-Control:
              schema:
                type: "string"
                const: "private, no-store"
          content:
            "image/jpeg":
              schema:
                type: "string"
                format: "binary"
            "image/png":
              schema:
                type: "string"
                format: "binary"
        "404":
