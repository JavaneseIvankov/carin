  "/api/v1/catalog/foods":
    get:
      operationId: "searchFoods"
      summary: "Search backend-imported catalog and serving/source data"
      parameters:
        -
          name: "cursor"
          in: "query"
          schema:
            type: "string"
            minLength: 1
            maxLength: 500
        -
          name: "limit"
          in: "query"
