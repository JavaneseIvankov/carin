# Carin contract 1.0.0 — validated with specs/validate-contracts.py
openapi: "3.1.1"
info:
  title: "Carin Application Resource API"
  version: "1.0.0"
  description: "Mobile/backend contract for Carin-owned resources. Better Auth raw /api/auth/* endpoints use pinned SDK/generated vendor schema and mandatory registration hooks described in 03-system-architecture.md. All application routes require verified DB session except explicitly public routes. Business invariants in 02-domain-model-and-business-rules.md apply in addition to schema. JSON timestamps include timezone offset; storage normalizes UTC. Resource ownership is server-enforced; no userId supplied by client."
servers:
  -
    url: "https://api.carin.example"
    description: "Illustrative external API base; replace per environment."
security:
  -
    SessionCookie: []
paths:
  "/health/live":
    get:
      operationId: "getLiveness"
      summary: "Process liveness"
      security: []
      responses:
        "200":
          description: "Successful response"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  "/health/ready":
    get:
      operationId: "getReadiness"
      summary: "DB/schema readiness; AI degradation does not block core record APIs"
      security: []
      responses:
        "200":
          description: "Successful response"
          content:
            "application/json":
