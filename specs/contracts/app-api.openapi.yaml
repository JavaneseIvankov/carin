        default:
          $ref: "#/components/responses/Error"
  "/api/v1/analysis-jobs/{id}/retry":
    post:
      operationId: "retryAnalysisJob"
      summary: "New attempt job from a retryable terminal job using same frozen snapshot"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "Stable for retry of the same action. Same key/different payload is 409; retention 24h."
      description: "Only failed retryable jobs. New job ID, same target snapshot/generation; invalidation or deletion gives 409/404. No request body."
      responses:
        "202":
          description: "Successful response"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AnalysisJob"
