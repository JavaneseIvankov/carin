        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    SessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "better-auth.session_token"
      description: "Conceptual cookie; actual name/prefix follows pinned Better Auth environment config. Expo plugin SecureStore cookie is sent on native requests."
  schemas:
    LegalDocument:
      type: "object"
      additionalProperties: false
      properties:
        version:
          type: "string"
          minLength: 1
          maxLength: 500
        title:
          type: "string"
          minLength: 1
          maxLength: 500
        contentMarkdown:
          type: "string"
          minLength: 1
        effectiveAt:
          type: "string"
          format: "date-time"
      required: ["version", "title", "contentMarkdown", "effectiveAt"]
    LegalRegistry:
      type: "object"
      additionalProperties: false
      properties:
        terms:
          $ref: "#/components/schemas/LegalDocument"
        privacy:
          $ref: "#/components/schemas/LegalDocument"
        aiProcessing:
          $ref: "#/components/schemas/LegalDocument"
      required: ["terms", "privacy", "aiProcessing"]
    Me:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
        emailVerified:
          const: true
        name:
          type: "string"
          minLength: 1
          maxLength: 500
        birthDate:
          type: "string"
          format: "date"
        timezone:
          type: "string"
          minLength: 1
          maxLength: 500
        settingsRevision:
          type: "integer"
          minimum: 1
        acceptedTermsVersion:
          type: "string"
          minLength: 1
          maxLength: 500
        acceptedPrivacyVersion:
          type: "string"
          minLength: 1
          maxLength: 500
        aiConsent:
          type: "object"
          additionalProperties: false
          properties:
            version:
              anyOf:
                -
                  type: "string"
                  minLength: 1
                  maxLength: 500
                -
                  type: "null"
            granted:
              type: "boolean"
            updatedAt:
              anyOf:
                -
                  type: "string"
                  format: "date-time"
                -
                  type: "null"
          required: ["version", "granted", "updatedAt"]
      required: ["id", "email", "emailVerified", "name", "birthDate", "timezone", "settingsRevision", "acceptedTermsVersion", "acceptedPrivacyVersion", "aiConsent"]
    MeUpdate:
      type: "object"
      additionalProperties: false
      properties:
        expectedRevision:
          type: "integer"
          minimum: 1
        timezone:
          type: "string"
          minLength: 1
          maxLength: 500
      required: ["expectedRevision", "timezone"]
    Profile:
      type: "object"
      additionalProperties: false
      properties:
        version:
          type: "integer"
          minimum: 0
        updatedAt:
          anyOf:
            -
              type: "string"
              format: "date-time"
            -
              type: "null"
        fields:
          type: "object"
          additionalProperties: false
          properties:
            heightCm:
              anyOf:
                -
                  type: "number"
                  exclusiveMinimum: 0
                -
                  type: "null"
            weightKg:
              anyOf:
                -
                  type: "number"
                  exclusiveMinimum: 0
                -
                  type: "null"
            sexForReference:
              anyOf:
                -
                  type: "string"
                  enum: ["female", "male"]
                -
                  type: "null"
            diagnoses:
              type: "object"
              additionalProperties: false
              properties:
                state:
                  type: "string"
                  enum: ["not_provided", "none_known", "never_examined", "reported"]
                entries:
                  type: "array"
                  items:
                    type: "object"
                    additionalProperties: false
