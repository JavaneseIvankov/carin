[project]
name = "carin-ai-service"
version = "0.1.0"
description = "Internal Carin AI REST service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "Pillow>=11,<13",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "jsonschema>=4.23,<5",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.7,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
