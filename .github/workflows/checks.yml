name: Checks

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [carin-app, carin-api]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.package }}
      - run: pnpm run typecheck
        working-directory: ${{ matrix.package }}
      - run: pnpm run lint
        working-directory: ${{ matrix.package }}
      - run: pnpm run test:unit
        working-directory: ${{ matrix.package }}
      - run: pnpm run test:integration
        working-directory: ${{ matrix.package }}

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: specs/requirements-contracts.txt
      - run: python -m pip install -r specs/requirements-contracts.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: carin-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: carin-app
      - run: pnpm run contracts:check
        working-directory: carin-app
      - run: node --test scripts/tests/generate-contracts.test.mjs
      - run: python -B -m unittest discover -s scripts/tests
      - run: python specs/validate-contracts.py
      - run: python -B -m unittest discover -s ai-service/tests
      - run: python -B ai-service/validate_data_artifacts.py
